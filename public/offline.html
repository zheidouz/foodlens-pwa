<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10b981" />
  <title>Offline — FoodLens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(to bottom, #ecfdf5, #ffffff);
      color: #18181b;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
    }
    .icon svg { width: 40px; height: 40px; color: white; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #059669;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #71717a;
      max-width: 300px;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }
    .offline-badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: #fef3c7;
      color: #b45309;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .retry-btn {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 999px;
      background: #10b981;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #059669; }
    .retry-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Connect to the internet to scan food products and see your history.</p>
  <p>Previously viewed results are still available.</p>
  <span class="offline-badge">⚠ No Connection</span>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
